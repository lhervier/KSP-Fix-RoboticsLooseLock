// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Gives a robotic part (piston, hinge, rotation servo, rotor) its motor drive back as soon as on-rails time warp is
// over. Without it, a robotic part that loads during on-rails warp, or whose settings change during it, keeps a motor
// with no strength: locked, it can slide or swing freely while its window still says it is locked.
restoreDriveAfterWarp = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time a robotic part's
// drive is zeroed during warp and each time it is configured again.
logLevel = Info
